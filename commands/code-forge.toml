description = "在一个可验证的目标上跑对抗回环（提方案 ⇄ 找反例 ⇄ 代码判定），过程直播到本地监控台"
prompt = """
Use the code-forge skill to run an adversarial loop on this goal: {{args}}

If the text after the colon above is empty, or too vague to be a goal ("optimize it"):
**do not invent a goal and start.** If this conversation just discussed a concrete problem,
distill it into one candidate goal and confirm with me; otherwise just ask me what to do,
in the language I am speaking. Until the goal is established, do not call loop_begin and do
not scan the repo for gate candidates.

Follow the skill's protocol: settle the gate command first (one runnable now that reflects the
goal; add a metric if the goal carries a number), then loop_begin (pass lang = my conversation
language) and tell me the console URL; each round let the proposer and the critic work and
loop_say for themselves, then loop_gate at the round's end.

Remember three things: only loop_gate rules success; the gate must never be loosened or swapped
to pass; when it stops, state truthfully which of the seven stop reasons it was.
"""
